<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Joy Salon - Manajemen Reservasi</title>
    <!-- FontAwesome untuk ikon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: flex;
            background-color: #ff80ab;
            color: #333;
            min-height: 100vh;
        }
        /* Sidebar Styling */
        .sidebar {
            width: 240px;
            background-color: #0f4c81;
            color: #fff;
            padding: 20px 0;
            flex-shrink: 0;
        }

        .sidebar .brand {
            padding: 0 20px 20px;
            font-size: 20px;
            font-weight: bold;
            border-bottom: 1px solid #0f4c81    ``````````````````````````````````````````````````````````````````````````````````````````````````````````````````````````````````````````````````````````````````;
        }

        .sidebar ul {
            list-style: none;
            margin-top: 15px;
        }

        .sidebar ul li a {
            display: flex;
            align-items: center;
            padding: 12px 20px;
            color: #bda8c3;
            text-decoration: none;
            font-size: 14px;
            transition: 0.3s;
        }

        .sidebar ul li a i {
            margin-right: 12px;
            width: 20px;
            text-align: center;
        }

        .sidebar ul li.active a, .sidebar ul li a:hover {
            background-color: #52335a;
            color: #fff;
        }

        /* Main Content Styling */
        .main-content {
            flex-grow: 1;
            padding: 30px;
            overflow-x: auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .header h2 {
            font-size: 24px;
            color: #2c1a31;
        }

        .header p {
            font-size: 13px;
            color: #777;
        }

        .btn-primary {
            background-color: #3d2244;
            color: white;
            padding: 10px 18px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
        }

        .btn-primary:hover {
            background-color: #52335a;
        }

        /* Filters Section */
        .filter-section {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .filter-section input, .filter-section select {
            padding: 10px 14px;
            border: 1px solid #ddd;
            border-radius: 8px;
            outline: none;
            background-color: #fff;
            font-size: 14px;
        }

        .filter-section input[type="text"] {
            flex-grow: 1;
            min-width: 250px;
        }

        /* Table Styling */
        .table-container {
            background-color: #fff;
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 14px;
        }

        th {
            padding: 12px 15px;
            color: #777;
            font-weight: 600;
            border-bottom: 1px solid #eee;
        }

        td {
            padding: 14px 15px;
            border-bottom: 1px solid #f9f9f9;
        }

        /* Badge Status */
        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        .badge-menunggu { background-color: #fff4e5; color: #b76e00; }
        .badge-dikonfirmasi { background-color: #e6f4ea; color: #137333; }
        .badge-selesai { background-color: #e8f0fe; color: #1a73e8; }
        .badge-ditolak { background-color: #fce8e6; color: #c5221f; }

        /* Action Buttons */
        .action-btn {
            border: none;
            background: none;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            margin-right: 8px;
            text-decoration: underline;
        }

        .btn-confirm { color: #137333; }
        .btn-reject { color: #c5221f; }
        .btn-edit { color: #b76e00; }
        .btn-finish { color: #1a73e8; }
        .btn-view { color: #555; }

        /* Responsive Breakpoint */
        @media (max-width: 768px) {
            body {
                flex-direction: column;
            }
            .sidebar {
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <!-- Sidebar Menu (UI/UX Kiri) -->
    <div class="sidebar">
        <div class="brand">Joy Salon</div>
        <ul>
            <li><a href="#"><i class="fa-solid fa-house"></i> Beranda</a></li>
            <li class="active"><a href="#"><i class="fa-solid fa-calendar-check"></i> Reservasi</a></li>
            <li><a href="#"><i class="fa-solid fa-list-check"></i> Treatment</a></li>
            <li><a href="#"><i class="fa-solid fa-user-group"></i> Karyawan</a></li>
            <li><a href="#"><i class="fa-solid fa-users"></i> Pelanggan</a></li>
            <li><a href="#"><i class="fa-solid fa-chart-line"></i> Pemasukan</a></li>
            <li><a href="#"><i class="fa-solid fa-wallet"></i> Pengeluaran</a></li>
            <li><a href="#"><i class="fa-solid fa-file-lines"></i> Laporan</a></li>
            <li><a href="#"><i class="fa-solid fa-right-from-bracket"></i> Keluar</a></li>
        </ul>
    </div>

    <!-- Main Content Area (UI/UX Kanan) -->
    <div class="main-content">
        <div class="header">
            <div>
                <h2>Reservasi</h2>
                <p>Jumat, 18 September 2026 • 14 jadwal</p>
            </div>
            <button class="btn-primary" class="bg-[#0f4c81] onclick="alert('Tambah Reservasi Baru')">+ Tambah reservasi</button>
        </div>
        <!-- Fitur Pencarian & Filter -->
        <div class="filter-section">
            <input type="text" id="searchInput" placeholder="Cari nama pelanggan atau nomor HP..." onkeyup="filterData()">
            <input type="date" id="dateFilter" value="2026-09-18" onchange="filterData()">
            <select id="statusFilter" onchange="filterData()">
                <option value="">Semua Status</option>
                <option value="Menunggu">Menunggu</option>
                <option value="Dikonfirmasi">Dikonfirmasi</option>
                <option value="Selesai">Selesai</option>
                <option value="Ditolak">Ditolak</option>
            </select>
        </div>

        <!-- Tabel Utama -->
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Kode</th>
                        <th>Pelanggan</th>
                        <th>Treatment</th>
                        <th>Jam</th>
                        <th>Karyawan</th>
                        <th>Status</th>
                        <th>Aksi</th>
                    </tr>
                </thead>
                <tbody id="reservationTable">
                    <!-- Data akan dirender secara dinamis melalui JavaScript -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Logika JavaScript (CRUD / Interactive Data) -->
    <script>
        // Data Sample Reservasi
        let reservations = [
            { id: "RS-1043", customer: "susmita", phone: "08123456789", treatment: "Smoothing", time: "15:00", employee: "Rina", status: "Menunggu", date: "2026-09-18" },
            { id: "RS-1042", customer: "ririn", phone: "08234567890", treatment: "Potong pria", time: "13:00", employee: "Bagas", status: "Dikonfirmasi", date: "2026-09-18" },
            { id: "RS-1041", customer: "santi", phone: "08345678901", treatment: "Creambath + potong", time: "11:30", employee: "Tika", status: "Selesai", date: "2026-09-18" },
            { id: "RS-1040", customer: "siska", phone: "08456789012", treatment: "Hair spa", time: "10:00", employee: "Rina", status: "Selesai", date: "2026-09-18" },
            { id: "RS-1039", customer: "laura", phone: "08567890123", treatment: "Facial dasar", time: "16:30", employee: "-", status: "Ditolak", date: "2026-09-18" }
        ];

        // Render data ke tabel
        function renderTable(data) {
            const tableBody = document.getElementById("reservationTable");
            tableBody.innerHTML = "";

            if (data.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="7" style="text-align:center; padding: 20px; color: #888;">Tidak ada data reservasi.</td></tr>`;
                return;
            }

            data.forEach(item => {
                let badgeClass = "";
                let actionButtons = "";

                // Logika Status & Aksi sesuai instruksi:
                if (item.status === "Menunggu") {
                    badgeClass = "badge-menunggu";
                    actionButtons = `
                        <button class="action-btn btn-confirm" onclick="updateStatus('${item.id}', 'Dikonfirmasi')">Konfirmasi</button>
                        <button class="action-btn btn-reject" onclick="updateStatus('${item.id}', 'Ditolak')">Tolak</button>
                    `;
                } else if (item.status === "Dikonfirmasi") {
                    badgeClass = "badge-dikonfirmasi";
                    actionButtons = `
                        <button class="action-btn btn-edit" onclick="alert('Ubah data ${item.id}')">Ubah</button>
                        <button class="action-btn btn-finish" onclick="updateStatus('${item.id}', 'Selesai')">Selesai</button>
                    `;
                } else if (item.status === "Selesai") {
                    badgeClass = "badge-selesai";
                    actionButtons = `<button class="action-btn btn-view" onclick="alert('Detail data ${item.id}')">Lihat</button>`;
                } else if (item.status === "Ditolak") {
                    badgeClass = "badge-ditolak";
                    actionButtons = `<button class="action-btn btn-view" onclick="alert('Detail data ${item.id}')">Lihat</button>`;
                }

                const row = `
                    <tr>
                        <td><strong>${item.id}</strong></td>
                        <td>${item.customer}</td>
                        <td>${item.treatment}</td>
                        <td>${item.time}</td>
                        <td>${item.employee}</td>
                        <td><span class="badge ${badgeClass}">${item.status}</span></td>
                        <td>${actionButtons}</td>
                    </tr>
                `;
                tableBody.innerHTML += row;
            });
        }

        // Fitur Filter dan Pencarian
        function filterData() {
            const searchValue = document.getElementById("searchInput").value.toLowerCase();
            const dateValue = document.getElementById("dateFilter").value;
            const statusValue = document.getElementById("statusFilter").value;

            const filtered = reservations.filter(item => {
                const matchesSearch = item.customer.toLowerCase().includes(searchValue) || item.phone.includes(searchValue);
                const matchesDate = dateValue ? item.date === dateValue : true;
                const matchesStatus = statusValue ? item.status === statusValue : true;

                return matchesSearch && matchesDate && matchesStatus;
            });

            renderTable(filtered);
        }

        // Update status reservasi (Aksi)
        function updateStatus(id, newStatus) {
            const index = reservations.findIndex(item => item.id === id);
            if (index !== -1) {
                reservations[index].status = newStatus;
                filterData(); // Refresh tampilan setelah update
            }
        }

        // Render pertama kali saat halaman dimuat
        document.addEventListener("DOMContentLoaded", () => {
            renderTable(reservations);
        });
    </script>
</body>
</html>
